<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Define codificación, escala adaptable y nombre de esta vista. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial y trazabilidad Jira</title>
  <!-- Carga estilos globales y de historial junto con el SDK de Firebase. -->
  <link rel="icon" type="image/png" href="assets/img/ImaginiALogo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/history.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <!-- Ajustes de presentación propios de la lista histórica. -->
  <style>
    /* Centra el contenido del historial y limita su ancho de lectura. */
    .history-layout {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Alinea el título y el enlace de regreso en la cabecera. */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    /* Distribuye los filtros en columnas adaptables. */
    .history-filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    /* Apila los registros históricos con separación uniforme. */
    .history-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    /* Presentación de cada caso en la lista del historial. */
    .history-item {
      padding: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    /* Coloca el identificador y el distintivo de escalamiento en una fila. */
    .history-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* Separa el resumen del caso de sus metadatos. */
    .history-item p {
      margin: 0 0 12px;
    }

    /* Distribuye responsable, estado, prioridad y fecha de revisión. */
    .history-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
  </style>
</head>

<body data-page="history">
  <!-- Contenedor de la vista de registros anteriores. -->
  <div class="history-layout">
    <!-- Título de la vista y navegación de regreso al dashboard. -->
    <header class="history-header">
      <div>
        <p class="eyebrow">Trazabilidad histórica</p>
        <h1>Registros pasados y seguimiento por caso</h1>
      </div>

      <a href="index.html">
        <button class="secondary">Volver al dashboard</button>
      </a>
    </header>

    <!-- Filtros para localizar registros por atributos y periodo de revisión. -->
    <section class="card filters">
      <div class="filter-row">
        <label>
          Estado
          <select id="historyFilterState">
            <option value="">Todos</option>
          </select>
        </label>

        <label>
          Responsable
          <select id="historyFilterResponsible">
            <option value="">Todos</option>
          </select>
        </label>

        <!-- <label>
            Prioridad
            <select id="historyFilterPriority">
              <option value="">Todas</option>
              <option value="P1">P1</option>
              <option value="P2">P2</option>
              <option value="P3">P3</option>
              <option value="Alta">Alta</option>
              <option value="Media">Media</option>
              <option value="Baja">Baja</option>
              <option value="Sin prioridad">Sin prioridad</option>
            </select>
          </label> -->

        <label>
          Desde
          <input id="historyDateFrom" type="date" />
        </label>

        <label>
          Hasta
          <input id="historyDateTo" type="date" />
        </label>

        <label>
          Escalado
          <select id="historyEscalatedOnly">
            <option value="all">Todos</option>
            <option value="escalados">Solo escalados</option>
            <option value="no-escalados">Sin escalar</option>
          </select>
        </label>
      </div>
    </section>

    <!-- El controlador inserta aquí los casos que coinciden con los filtros. -->
    <section id="historyList" class="history-list"></section>
  </div>

  <!-- Carga primero el acceso a datos y después el controlador compartido de vistas. -->
  <script src="assets/js/api/firebase.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
